<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" preserveAspectRatio="xMidYMid meet" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>DCH · The Context Engine — engineering sources flow into a governed context graph and return precise query results</title>
<style>
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .edge-flow{stroke-dasharray:6 10;animation:flow 3s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-32}}
  .hub-glow{animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="hg-edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4C6BFF" stop-opacity="0.85"/><stop offset="100%" stop-color="#C28BFF" stop-opacity="0.85"/></linearGradient>
  <radialGradient id="hg-hub" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6B45E8" stop-opacity="0.55"/><stop offset="100%" stop-color="#6B45E8" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg-blue" cx="0" cy="0" r="1.1"><stop offset="0%" stop-color="#2747E0" stop-opacity="0.2"/><stop offset="55%" stop-color="#2747E0" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg-purple" cx="1" cy="1" r="1.1"><stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/><stop offset="55%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <radialGradient id="grid-fade" cx="0.5" cy="0.5" r="0.72"><stop offset="30%" stop-color="#fff"/><stop offset="90%" stop-color="#000"/></radialGradient>
  <linearGradient id="stat-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4C6BFF"/><stop offset="100%" stop-color="#C28BFF"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern>
  <mask id="grid-mask"><rect width="1320" height="780" fill="url(#grid-fade)"/></mask>
  <filter id="dot-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

<!-- Card background: dark base, blue/purple radial washes, faded grid -->
<rect width="1320" height="780" rx="30" fill="#0B0B0C"/>
<rect width="1320" height="780" rx="30" fill="url(#bg-blue)"/>
<rect width="1320" height="780" rx="30" fill="url(#bg-purple)"/>
<rect width="1320" height="780" rx="30" fill="url(#grid)" mask="url(#grid-mask)"/>

<!-- Header row -->
<text x="40" y="62" font-family="ui-monospace, monospace" font-size="15" letter-spacing="0.18em" font-weight="500" fill="rgba(255,255,255,0.85)">DCH · THE CONTEXT ENGINE</text>
<g>
